<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join AGGE — Register Membership</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0c1a2b',
            'navy-mid': '#152a42',
            'navy-light': '#1e3a56',
            sand: '#d9cbb0',
            sandstone: '#c4a57b',
            'sand-light': '#ede4d3',
            sage: '#7a9b76',
            'sage-light': '#a3bf9f',
            copper: '#b87333',
            'copper-light': '#d4956a',
            cream: '#f7f3ec',
          },
          fontFamily: {
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen bg-navy text-white relative">
  <div class="contour-bg opacity-20"></div>

  <!-- Header minimal -->
  <header class="p-6">
    <div class="mx-auto max-w-6xl flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <img src="https://agge.in/assets/images/resources/ColorAGGE_LOGO__2@4x.png" alt="AGGE Logo" class="h-10" />
      </a>
      <a href="index.html" class="text-xs text-sand hover:underline font-semibold">← Return to Main Site</a>
    </div>
  </header>

  <!-- Register Card -->
  <main class="flex-1 flex items-center justify-center px-6 py-12 relative z-10 page-transition-wrapper">
    <div class="w-full max-w-lg bg-navy-mid/90 backdrop-blur rounded-3xl p-8 md:p-10 border border-navy-light shadow-2xl">
      <div class="text-center mb-8">
        <div class="h-12 w-12 rounded-2xl bg-copper/20 flex items-center justify-center text-copper text-xl mx-auto mb-4">
          <i class="fas fa-id-card"></i>
        </div>
        <h1 class="font-display text-2xl font-bold text-cream">Apply for AGGE Membership</h1>
        <p class="text-xs text-slate-400 mt-1">Join thousands of geoscientists and geo-engineers worldwide.</p>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='checkout.html';">
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">First Name</label>
              <input type="text" required placeholder="Jane" class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:border-copper focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Last Name</label>
              <input type="text" required placeholder="Smith" class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:border-copper focus:outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
            <input type="email" required placeholder="jane.smith@university.edu" class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:border-copper focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Membership Category</label>
            <select class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white focus:border-copper focus:outline-none">
              <option value="professional">Professional Member ($120 / year)</option>
              <option value="student">Student Member ($25 / year)</option>
              <option value="corporate">Corporate Contact</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Institution / Organization</label>
            <input type="text" placeholder="University / Company Name" class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:border-copper focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
            <input type="password" required placeholder="Create a strong password" class="w-full rounded-xl bg-navy border border-navy-light px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:border-copper focus:outline-none" />
          </div>
          <button type="submit" class="w-full rounded-full bg-gradient-to-r from-copper to-copper-light py-3 text-xs font-bold text-white shadow-lg hover:scale-105 transition mt-4">
            Proceed to Payment &amp; Activation →
          </button>
        </div>
      </form>

      <div class="mt-8 pt-6 border-t border-navy-light text-center text-xs text-slate-400">
        Already a member? <a href="login.html" class="text-sand font-semibold hover:underline">Sign in here</a>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 relative z-10">
    © <span id="copyright-year">2026</span> Association of Geosciences &amp; Geo Engineering.
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
