<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — AGGE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0c1a2b',
            'navy-mid': '#152a42',
            'navy-light': '#1e3a56',
            sand: '#d9cbb0',
            sandstone: '#c4a57b',
            'sand-light': '#ede4d3',
            sage: '#7a9b76',
            'sage-light': '#a3bf9f',
            copper: '#b87333',
            'copper-light': '#d4956a',
            cream: '#f7f3ec',
          },
          fontFamily: {
            sans: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
            display: ['"DM Serif Display"', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen bg-cream text-navy">

  <!-- Header minimal -->
  <header class="p-6 bg-navy text-white border-b border-navy-light">
    <div class="mx-auto max-w-6xl flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <img src="https://agge.in/assets/images/resources/ColorAGGE_LOGO__2@4x.png" alt="AGGE Logo" class="h-10" />
      </a>
      <a href="index.html" class="text-xs text-sand hover:underline font-semibold">← Cancel &amp; Return</a>
    </div>
  </header>

  <!-- Checkout Grid -->
  <main class="flex-1 py-12 px-6 page-transition-wrapper">
    <div class="mx-auto max-w-4xl grid md:grid-cols-3 gap-8">
      
      <!-- Payment Form -->
      <div class="md:col-span-2 bg-white rounded-3xl p-8 border border-sand/40 shadow-sm space-y-6">
        <h1 class="font-display text-2xl font-bold text-navy">Secure Checkout</h1>
        
        <form onsubmit="event.preventDefault(); alert('Payment Successful! Welcome to AGGE.'); window.location.href='dashboard.html';">
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Cardholder Name</label>
              <input type="text" required placeholder="Dr. Alex Vance" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-xs focus:border-navy focus:outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Card Number</label>
              <input type="text" required placeholder="4532 •••• •••• 8842" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-xs focus:border-navy focus:outline-none" />
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Expiry Date</label>
                <input type="text" required placeholder="MM / YY" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-xs focus:border-navy focus:outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">CVC / CVC2</label>
                <input type="text" required placeholder="•••" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-xs focus:border-navy focus:outline-none" />
              </div>
            </div>

            <button type="submit" class="w-full rounded-full bg-gradient-to-r from-copper to-copper-light py-3.5 text-xs font-bold text-white shadow-lg hover:scale-105 transition mt-4">
              Complete Payment &amp; Activate →
            </button>
          </div>
        </form>
      </div>

      <!-- Order Summary -->
      <div class="bg-navy text-white rounded-3xl p-6 border border-sandstone h-fit relative overflow-hidden">
        <div class="contour-bg opacity-15"></div>
        <h2 class="font-display text-xl font-bold text-sand mb-4 relative z-10">Order Summary</h2>
        
        <div class="space-y-3 border-b border-navy-light pb-4 text-xs text-slate-300 relative z-10">
          <div class="flex justify-between">
            <span>AGGE Professional Member (1 Yr)</span>
            <span class="font-semibold text-white">$120.00</span>
          </div>
          <div class="flex justify-between">
            <span>Journal Subscriptions</span>
            <span class="font-semibold text-sage">Included</span>
          </div>
          <div class="flex justify-between">
            <span>Registration Fee</span>
            <span class="font-semibold text-white">$0.00</span>
          </div>
        </div>

        <div class="flex justify-between pt-4 text-sm font-bold text-cream relative z-10">
          <span>Total Amount</span>
          <span class="text-sand text-base">$120.00</span>
        </div>
      </div>

    </div>
  </main>

  <footer class="py-6 text-center text-xs text-slate-500 border-t border-sand/30 mt-auto">
    © <span id="copyright-year">2026</span> Association of Geosciences &amp; Geo Engineering. Secure 256-bit SSL Encryption.
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
